<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Rust 精通之路">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141417" />
      <stop offset="0.62" stop-color="#241713" />
      <stop offset="1" stop-color="#3a1c14" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a5c" />
      <stop offset="1" stop-color="#f59e0b" />
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="1080" cy="90" r="260" fill="#ce422b" fill-opacity="0.16" />
  <circle cx="120" cy="600" r="220" fill="#f59e0b" fill-opacity="0.08" />

  <g transform="translate(88 84)">
    <rect width="76" height="76" rx="18" fill="#1d1d21" stroke="#ce422b" stroke-width="3" />
    <text
      x="38"
      y="54"
      text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="42"
      font-weight="800"
      fill="#ff9a76"
    >R</text>
  </g>

  <text x="88" y="248" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="78" font-weight="800" fill="#ffffff">Rust 精通之路</text>
  <text x="88" y="314" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="500" fill="#cbd5e1">从第一行代码，到生产级工程</text>

  <rect x="88" y="366" width="1024" height="2" fill="url(#accent)" opacity="0.6" />

  <g font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="24" fill="#94a3b8">
    <text x="88" y="432">所有权 · 借用 · 生命周期</text>
    <text x="430" y="432">trait · 泛型 · 智能指针</text>
    <text x="760" y="432">并发 · 异步 · 宏 · unsafe</text>
    <text x="88" y="486">18 个章节 · 58 个可运行示例 · 在线编辑运行</text>
  </g>

  <g transform="translate(88 538)">
    <rect width="196" height="44" rx="22" fill="#ce422b" />
    <text x="98" y="29" text-anchor="middle" font-family="'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" font-weight="600" fill="#ffffff">由浅入深 · 直达精通</text>
  </g>
