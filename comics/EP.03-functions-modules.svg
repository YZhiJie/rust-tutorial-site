<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#CE422B"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.03</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">函数、模块与 Cargo</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Rust 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：多写的分号</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="300" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">函数明明写了 n * 2，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">返回类型怎么对不上？</text>
    <rect x="24" y="152" width="524" height="112" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">fn double(n: i32) -&gt; i32 {</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    n * 2;</text>
    <text x="38" y="212" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="232" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">error[E0308]: mismatched types</text>
    <text x="38" y="252" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">expected `i32`, found `()`</text>
    <rect x="24" y="280" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="280" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="302" font-size="13.5" fill="#e2e8f0">尾表达式加了分号就变成语句，</text>
    <text x="40" y="322" font-size="13.5" fill="#94a3b8">函数返回值从 i32 悄悄变成 ()。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：表达式与语句</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="88" width="336" height="34" rx="10" fill="#f8fafc"/>
    <text x="102" y="110" font-size="15" fill="#0b1220">不加分号的最后一行，就是返回值。</text>
    <rect x="32" y="134" width="200" height="28" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="132" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22d3ee">表达式 n * 2：有值</text>
    <polygon points="250,148 242,144 242,152" fill="#64748b"/>
    <rect x="260" y="134" width="220" height="28" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="370" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f472b6">语句 n * 2;：值是 ()</text>
    <text x="38" y="182" font-size="12" fill="#94a3b8">分号是分水岭：尾表达式不带分号就是返回值</text>
    <rect x="24" y="194" width="524" height="92" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="216" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">fn double(n: i32) -&gt; i32 {</text>
    <text x="38" y="234" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    if n &lt; 0 { return -n * 2; }</text>
    <text x="38" y="252" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    n * 2          // 尾表达式即返回值</text>
    <text x="38" y="270" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <rect x="24" y="300" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="300" width="4" height="46" rx="2" fill="#a78bfa"/>
    <text x="40" y="320" font-size="13.5" fill="#e2e8f0">表达式产生值，语句以分号收尾没有值；</text>
    <text x="40" y="338" font-size="13.5" fill="#94a3b8">return 只用于提前结束函数。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：mod、pub、use</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="322" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">函数搬进模块里，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">外面怎么就调不到了？</text>
    <rect x="24" y="152" width="524" height="128" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">mod utils {</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    pub fn add(a: i32, b: i32) -&gt; i32 {</text>
    <text x="38" y="212" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">        a + b</text>
    <text x="38" y="232" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    }</text>
    <text x="38" y="252" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="272" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">use crate::utils::add;</text>
    <rect x="24" y="296" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="46" rx="2" fill="#f472b6"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">模块默认私有，忘写 pub 报 E0603；</text>
    <text x="40" y="334" font-size="13.5" fill="#94a3b8">use 只引路径，可见性只能靠 pub。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：分号与可见性</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="316" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">分号管语句和值，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">pub 管能不能被看见。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">尾表达式多写分号 → error[E0308]</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">忘写 pub 对外不可见 → error[E0603]</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">crate:: / self:: / super:: 路径起点混用</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#CE422B"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">返回值交给尾表达式，可见性交给 pub。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · rust-tutorial · EP.03</text>
</svg>
