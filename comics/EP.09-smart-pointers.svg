<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#CE422B"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.09</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad)">智能指针家族</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">Rust 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：算不出大小</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="185" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">枚举里装个自己而已，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">编译器说大小算不出？</text>
    <rect x="24" y="152" width="524" height="132" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="172" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">enum List {</text>
    <text x="38" y="190" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    Cons(i32, List),  // 直接套娃</text>
    <text x="38" y="208" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">    Nil,</text>
    <text x="38" y="226" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="244" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">error[E0072]: List has infinite size</text>
    <text x="38" y="262" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">help: 用 Box 打断递归：Box&lt;List&gt;</text>
    <rect x="24" y="296" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="46" rx="2" fill="#22d3ee"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">递归类型不包装，大小会无限展开；</text>
    <text x="40" y="334" font-size="13.5" fill="#94a3b8">编译器要求每个类型的大小可计算。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：Box 定海针</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,99 74,105 88,111" fill="#f8fafc"/>
    <rect x="88" y="82" width="220" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Box 是固定大小的堆指针，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">递归就此有了尽头。</text>
    <rect x="32" y="134" width="150" height="28" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="107" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#22d3ee">① Box 堆上存值</text>
    <polygon points="192,148 184,144 184,152" fill="#64748b"/>
    <rect x="200" y="134" width="150" height="28" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="275" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#a78bfa">② Deref 像引用</text>
    <polygon points="360,148 352,144 352,152" fill="#64748b"/>
    <rect x="368" y="134" width="150" height="28" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="443" y="153" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#f472b6">③ Drop 自动清理</text>
    <text x="38" y="182" font-size="12" fill="#94a3b8">栈上只存一个指针，大小在编译期确定</text>
    <rect x="24" y="194" width="524" height="92" rx="8" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="38" y="216" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">enum List { Cons(i32, Box&lt;List&gt;), Nil }</text>
    <text x="38" y="236" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">let l = Cons(1, Box::new(Nil));</text>
    <text x="38" y="256" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace"># *b 自动解引用，方法穿透到内部值</text>
    <text x="38" y="276" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 离开作用域自动 drop，堆内存释放</text>
    <rect x="24" y="300" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="300" width="4" height="46" rx="2" fill="#a78bfa"/>
    <text x="40" y="320" font-size="13.5" fill="#e2e8f0">Box 所有权唯一，开销等同裸指针；</text>
    <text x="40" y="338" font-size="13.5" fill="#94a3b8">大对象上堆、dyn 装箱也都靠它。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：共享可变</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="210" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Rc 共享、RefCell 可改，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">搭出单线程共享可变！</text>
    <rect x="24" y="152" width="524" height="128" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">let c = Rc::new(RefCell::new(0));</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">let a = Rc::clone(&amp;c);  // 计数加一</text>
    <text x="38" y="212" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">*a.borrow_mut() += 1;  // 运行时借</text>
    <text x="38" y="232" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace"># borrow() 只读，borrow_mut() 独占</text>
    <text x="38" y="254" font-size="12.5" fill="#f472b6" font-family="'SF Mono',Consolas,monospace">panic: already mutably borrowed</text>
    <rect x="24" y="296" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="46" rx="2" fill="#f472b6"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">Rc::clone 只加计数不深拷贝；RefCell</text>
    <text x="40" y="334" font-size="13.5" fill="#94a3b8">把借用检查挪到运行时，违规就 panic。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：指针家规</text>
    <g transform="translate(52,110)">
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="175" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">单线程共享三件套，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">跨线程记得换 Arc。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="14" fill="#e2e8f0">Rc 不能跨线程，跨线程共享换 Arc</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="14" fill="#e2e8f0">RefCell 同时两个 mut 借用 → 运行时 panic</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="14" fill="#e2e8f0">Rc 循环引用会泄漏，用 Weak 打破环</text>
    <rect x="24" y="290" width="524" height="50" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="290" width="4" height="50" rx="2" fill="#CE422B"/>
    <text x="40" y="311" font-size="13.5" font-weight="bold" fill="#f97316">码叔总结</text>
    <text x="40" y="331" font-size="13.5" fill="#e2e8f0">谁能拥有、谁能改、何时清，指针家族各司其职。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · rust-tutorial · EP.09</text>
</svg>
