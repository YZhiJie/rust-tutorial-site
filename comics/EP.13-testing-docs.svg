    <text x="102" y="104" font-size="15" fill="#0b1220">错误路径和文档示例，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">也能交给机器自动验？</text>
    <rect x="24" y="152" width="524" height="128" rx="8" fill="#0a0f1c" stroke="#f472b6" stroke-opacity="0.35"/>
    <text x="38" y="174" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">#[should_panic(expected = "输入不能为空")]</text>
    <text x="38" y="192" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">fn rejects_blank() { slugify("   "); }</text>
    <text x="38" y="212" font-size="12.5" fill="#fbbf24" font-family="'SF Mono',Consolas,monospace">// tests/api.rs：从外部只调公开 API</text>
    <text x="38" y="232" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">/// assert_eq!(slugify("a b"), "a-b");</text>
    <text x="38" y="254" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// cargo test 连文档示例一起真跑</text>
    <rect x="24" y="296" width="524" height="46" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="296" width="4" height="46" rx="2" fill="#f472b6"/>
    <text x="40" y="316" font-size="13.5" fill="#e2e8f0">返回 Result 的测试可以用 ? 传播错误；</text>
    <text x="40" y="334" font-size="13.5" fill="#94a3b8">/// 文档示例随 cargo test 运行，防止腐烂。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="420,0 480,0 150,361 90,361" fill="#f97316" opacity="0.04"/>
