<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Rust 精通之路 Logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1b1f" />
      <stop offset="1" stop-color="#3a1c14" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a76" />
      <stop offset="1" stop-color="#ce422b" />
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#ffd9cc" />
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="52" fill="url(#bg)" />

  <g transform="translate(120 120)" fill="url(#ring)">
    <rect x="-7" y="-104" width="14" height="24" rx="5" />
    <rect x="-7" y="-104" width="14" height="24" rx="5" transform="rotate(45)" />
    <rect x="-7" y="-104" width="14" height="24" rx="5" transform="rotate(90)" />
    <rect x="-7" y="-104" width="14" height="24" rx="5" transform="rotate(135)" />
    <rect x="-7" y="-104" width="14" height="24" rx="5" transform="rotate(180)" />
    <rect x="-7" y="-104" width="14" height="24" rx="5" transform="rotate(225)" />
    <rect x="-7" y="-104" width="14" height="24" rx="5" transform="rotate(270)" />
    <rect x="-7" y="-104" width="14" height="24" rx="5" transform="rotate(315)" />
    <circle cx="0" cy="0" r="88" fill="none" stroke="url(#ring)" stroke-width="13" />
  </g>

  <circle cx="120" cy="120" r="68" fill="#151518" />

  <text
    x="120"
    y="157"
    text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
    font-size="92"
    font-weight="800"
    fill="url(#letter)"
  >R</text>

  <circle cx="176" cy="70" r="9" fill="#f59e0b" />
</svg>
